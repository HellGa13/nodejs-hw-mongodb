type: object
required:
  - _id
  - userId
  - accessToken
  - refreshToken
  - accessTokenValidUntil
  - refreshTokenValidUntil
properties:
  _id:
    description: "Session's unique identifier"
    type: string
    example: 64f7a2b9c3e8d20012a4b7c1
  userId:
    description: 'ID of the user associated with the session'
    type: string
    example: 64f7a2b9c3e8d20012a4b7c1
  accessToken:
    description: 'JWT access token for the session'
    type: string
    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2NGY3YTJiOWMzZThkMjAwMTJhNGI3YzEiLCJpYXQiOjE3MjU1MjAwMDB9.3xGQz9gWvZ1KJvW9vL8kzZz3uXz9YkLz9YkLz9YkLz9Y'
  refreshToken:
    description: 'JWT refresh token for the session'
    type: string
    example: 'd1f2e3g4h5i6j7k8l9m0n1o2p3q4r5s6t7u8v9w0x1y2z3a4b5c6d7e8f9g0h1i2j3k4l5m6n7o8p9q0r1s2t3u4v5w6x7y8z'
  accessTokenValidUntil:
    description: 'Timestamp when the access token expires'
    type: string
    format: date-time
    example: '2025-09-15T18:30:00Z'
  refreshTokenValidUntil:
    description: 'Timestamp when the refresh token expires'
    type: string
    format: date-time
    example: '2025-09-15T18:30:00Z'
